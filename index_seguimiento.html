<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Seguimiento de Denuncias</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #e8f0fa;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      color: #1a252f;
    }
    .container {
      width: 70%;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 30px 40px;
    }
    h1, h3 {
      text-align: center;
      color: #0b3d91;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #cfd8e3;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #0b3d91;
      color: white;
    }
    label {
      font-weight: 500;
      color: #2c3e50;
    }
    select {
      width: 100%;
      padding: 8px;
      border: 1px solid #b0c4de;
      border-radius: 4px;
      font-size: 14px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Seguimiento de Denuncias</h1>
    <h3>Sindicato de Funcionarios del MDS - SINFUSAS</h3>

    <!-- Filtro por socio -->
    <label for="socioFiltro">Seleccione su nombre:</label>
    <select id="socioFiltro">
      <option value="">-- Seleccione --</option>
    </select>

    <!-- Tabla dinámica de denuncias -->
    <table id="tablaDenuncias">
      <thead>
        <tr>
          <th>Socio</th>
          <th>Teléfono</th>
          <th>Tipo de denuncia</th>
          <th>Descripción</th>
          <th>Estado</th>
          <th>Obs./Seguimiento</th>
          <th>Responsable</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    let denunciasData = [];

    // Cargar denuncias desde denuncias_sinfu
    fetch("https://api.sheetbest.com/sheets/a81ec7fd-7bd5-4d63-9379-7c96f9d31bb0")
      .then(res => res.json())
      .then(data => {
        denunciasData = data;
        cargarTabla(); // inicial vacío
      });

    // Cargar lista de socios en desplegable
    fetch('lista_socios.csv')
      .then(response => response.text())
      .then(data => {
        const lineas = data.split('\n');
        const select = document.getElementById('socioFiltro');
        lineas.forEach(linea => {
          const [nombre, ci] = linea.split(';');
          if(nombre && ci){
            const option = document.createElement('option');
            option.value = `${nombre.trim()} — ${ci.trim()}`;
            option.textContent = `${nombre.trim()} — ${ci.trim()}`;
            select.appendChild(option);
          }
        });
      })
      .catch(error => console.error('Error al cargar lista de socios:', error));

    // Filtrar tabla al seleccionar socio
    document.getElementById('socioFiltro').addEventListener('change', function(){
      cargarTabla(this.value);
    });

    function cargarTabla(socioSeleccionado = ""){
      const tbody = document.querySelector("#tablaDenuncias tbody");
      tbody.innerHTML = "";
      denunciasData.forEach(row => {
        if(!socioSeleccionado || row.SOCIO === socioSeleccionado){
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.SOCIO}</td>
            <td>${row.TELEFONO || ""}</td>
            <td>${row.TIPO_DENUNCIA || ""}</td>
            <td>${row.DESCRIPCION || ""}</td>
            <td>${row.ESTADO || ""}</td>
            <td>${row.OBS_SEGUIMIENTO || ""}</td>
            <td>${row.RESPONSABLE || ""}</td>
          `;
          tbody.appendChild(tr);
        }
      });
    }
  </script>
</body>
</html>
