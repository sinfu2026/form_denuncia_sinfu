<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Seguimiento de Denuncias</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #e8f0fa;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      color: #1a252f;
    }
    .container {
      width: 70%;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 30px 40px;
    }
    h1, h3 {
      text-align: center;
      color: #0b3d91;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #cfd8e3;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #0b3d91;
      color: white;
    }
    label {
      font-weight: 500;
      color: #2c3e50;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #b0c4de;
      border-radius: 4px;
      font-size: 14px;
      margin-top: 5px;
    }
    .mensaje-ayuda {
      text-align: center;
      color: #555;
      font-style: italic;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Seguimiento de Denuncias</h1>
    <h3>Sindicato de Funcionarios del MDS - SINFUSAS</h3>

    <!-- Mensaje de ayuda -->
    <p class="mensaje-ayuda">Ingrese el código que recibió al enviar su denuncia para ver el estado.</p>

    <!-- Filtro por código -->
    <label for="codigoFiltro">Código de denuncia:</label>
    <input type="text" id="codigoFiltro" placeholder="Ej: ABC1234">

    <!-- Tabla dinámica de denuncias -->
    <table id="tablaDenuncias">
      <thead>
        <tr>
          <th>Código</th>
          <th>Tipo de denuncia</th>
          <th>Estado</th>
          <th>Obs./Seguimiento</th>
          <th>Responsable</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    let denunciasData = [];

    // Cargar denuncias desde denuncias_sinfu
    fetch("https://api.sheetbest.com/sheets/a81ec7fd-7bd5-4d63-9379-7c96f9d31bb0")
      .then(res => res.json())
      .then(data => {
        denunciasData = data;
      });

    // Filtrar tabla al ingresar código
    document.getElementById('codigoFiltro').addEventListener('input', function(){
      cargarTabla(this.value.trim());
    });

    function cargarTabla(codigoSeleccionado = ""){
      const tbody = document.querySelector("#tablaDenuncias tbody");
      tbody.innerHTML = "";
      denunciasData.forEach(row => {
        if(!codigoSeleccionado || row.CODIGO === codigoSeleccionado){
          const tr = document.createElement("tr");

          // Definir color según estado
          let estadoColor = "";
          if(row.ESTADO === "Recibido") estadoColor = "background-color:#d4edda; color:#155724; font-weight:bold;"; // verde claro
          else if(row.ESTADO === "Asignado") estadoColor = "background-color:#cce5ff; color:#004085; font-weight:bold;"; // azul claro
          else if(row.ESTADO === "Tramite" || row.ESTADO === "En Tramite") estadoColor = "background-color:#fff3cd; color:#856404; font-weight:bold;"; // amarillo
          else if(row.ESTADO === "Finalizado") estadoColor = "background-color:#f8d7da; color:#721c24; font-weight:bold;"; // rojo claro

          tr.innerHTML = `
            <td>${row.CODIGO || ""}</td>
            <td>${row.TIPO_DENUNCIA || ""}</td>
            <td style="${estadoColor}">${row.ESTADO || ""}</td>
            <td>${row.OBS_SEGUIMIENTO || ""}</td>
            <td>${row.RESPONSABLE || ""}</td>
          `;
          tbody.appendChild(tr);
        }
      });

      // Mensaje si no se encuentra denuncia
      if(tbody.innerHTML === ""){
        const tr = document.createElement("tr");
        tr.innerHTML = `<td colspan="5" style="text-align:center; color:#888;">❌ No existe denuncia con ese código</td>`;
        tbody.appendChild(tr);
      }
    }
  </script>
</body>
</html>
